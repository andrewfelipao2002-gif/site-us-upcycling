<!DOCTYPE html>
<!-- lang pt-BR avisa ao navegador que o site é em português -->
<html lang="pt-BR">
<head>
  <!-- charset UTF-8 garante que acentos apareçam corretamente -->
  <meta charset="UTF-8">
  <!-- viewport faz o site se ajustar a telas de celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- título que aparece na aba do navegador -->
  <title>US Upcycling</title>
  <!-- liga o arquivo de estilos que vamos criar no próximo passo -->
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <!-- header guarda o topo da página, onde fica a logo centralizada -->
  <header class="topo">
    <!-- alt descreve a imagem para leitores de tela e caso ela não carregue -->
    <img src="imagens/logo.png" alt="Logo da US Upcycling" class="logo">
  </header>

  <!-- main vai receber o conteúdo principal (vitrine) nos próximos passos -->
  <main></main>
</body>
</html>
