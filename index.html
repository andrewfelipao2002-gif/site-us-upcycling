<!DOCTYPE html>
<!-- lang pt-BR avisa ao navegador que o site é em português -->
<html lang="pt-BR">
<head>
  <!-- charset UTF-8 garante que acentos apareçam corretamente -->
  <meta charset="UTF-8">
  <!-- viewport faz o site se ajustar a telas de celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- título que aparece na aba do navegador -->
  <title>US Upcycling</title>
  <!-- liga o arquivo de estilos que vamos criar no próximo passo -->
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <!-- header guarda o topo da página, onde fica a logo centralizada -->
  <header class="topo">
    <!-- faixa com a logo centralizada -->
    <div class="topo-logo">
      <!-- alt descreve a imagem para leitores de tela e caso ela não carregue -->
      <img src="imagens/logo.png" alt="Logo da US Upcycling" class="logo">
    </div>

    <!-- nav agrupa os links de navegação do site -->
    <nav class="menu">
      <!-- href com # leva para uma seção da mesma página (vamos criá-las depois) -->
      <a href="#inicio">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>


  <!-- main vai receber o conteúdo principal (vitrine) nos próximos passos -->
    <!-- main guarda o conteúdo principal da página -->
  <main>
    <!-- section "inicio": é para onde o link "Início" do menu leva (id="inicio") -->
    <section class="boas-vindas" id="inicio">
      <!-- título principal da página -->
      <h1>Peças com história, feitas à mão</h1>
      <!-- texto curto que apresenta o ateliê; depois você pode trocar pelo texto real -->
      <p>Na US Upcycling, materiais que seriam descartados ganham uma nova vida em peças únicas.</p>
      <!-- botão que leva para a seção de produtos (vamos criá-la depois) -->
      <a href="#produtos" class="botao">Ver produtos</a>
    </section>
  </main>
</body>
</html>
